name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}

      - name: Install package
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check nqct tests

      - name: Mypy
        run: uv run mypy nqct

      - name: Pytest
        run: uv run pytest tests/unit --cov=nqct --cov-report=term-missing
