[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nqct"
version = "0.2.0"
description = "Python client for NQCT Cloud — backends, jobs, functions, and circuits"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "NQCT Development Team" }]
keywords = ["quantum", "nqct", "qiskit", "cloud"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.5,<3",
    "typing-extensions>=4.8",
    #"sqdtoolz @ git+https://github.com/sqdlab/SQDToolz.git",
    "nbsphinx",
    "ipykernel>=6.0.0",
    "sphinx-rtd-theme"
]

[project.optional-dependencies]
qiskit = [
    "qiskit>=1.0",
    "qiskit-qasm3-import>=0.4",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.2",
]

[tool.uv]
default-groups = []

[project.urls]
Homepage = "https://github.com/NQCT-Australia/nqct-sdk"
Documentation = "https://github.com/NQCT-Australia/nqct-sdk#readme"
Repository = "https://github.com/NQCT-Australia/nqct-sdk"
"NQCT Cloud spec" = "https://github.com/NQCT-Australia/nqct-cloud/blob/main/references/specs/14-python-sdk.md"

[tool.hatch.build.targets.wheel]
packages = ["nqct"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["nqct", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# WIP lab helper (optional sqdtoolz/IPython); ignore until validate() is finished.
"nqct/utils/QuantumSession.py" = ["E501", "F821", "I001", "UP015"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
packages = ["nqct"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "nqct.utils.QuantumSession"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "sqdtoolz.*",
    "IPython.*",
    "pandas",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring a live NQCT Cloud API (nqct start or staging)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["nqct"]
branch = true

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.hatch.metadata]
allow-direct-references = true
